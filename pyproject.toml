[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-degradation-thesis"
version = "1.0.0"
description = "Battery degradation modelling for integrated design of wind-battery hybrid power plants"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Thodoris Tsonopoulos"}]

dependencies = [
    "numpy==2.4.1",
    "numpy-financial==1.0.0",
    "pandas==2.3.3",
    "scipy==1.17.0",
    "matplotlib==3.10.8",
    "pyyaml==6.0.3",
    "xarray==2025.12.0",
    "rainflow==3.2.0",
    "pyomo==6.10.0",
    "py_wake==2.6.18",
    "gurobipy==13.0.1",
]
# Versions pinned to the environment that produced every result in the thesis.
# Python 3.13.14. See README for how to reproduce.

[tool.setuptools.packages.find]
where = ["src"]
