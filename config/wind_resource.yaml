name: Wind Resource - ERA5 2022 Denmark Onshore (90 m hub height)
# -----------------------------------------------------------------
# This file stores CONFIGURATION and points to the RAW DATA time series.
# Weibull fitting is computed in degradation/site.py so this file can be swapped for any new met data without touching Python code.
#
# Data source : ERA5 reanalysis, pinned (models=era5) via the Open-Meteo
#               ARCHIVE endpoint (archive-api.open-meteo.com), NOT the best-match/forecast endpoint that blends ERA5 with other
#               models. Grid cell 56.25 N, 8.50 E (nearest ERA5 cell to the 56.20 N, 8.54 E site).
# Heights     : ERA5 archive serves 10 m and 100 m only at this location.
#               The 100 m series is scaled to 90 m hub height with a power-law exponent alpha = 0.17 (derived from the site's
#               own 10 m / 100 m levels) when the time series is built.
# Period      : 2022-01-01 00:00 to 2022-12-31 23:00 UTC (8760 hours)
# Provenance  : raw download saved as openmeteo_era5_raw_2022.json;
#               90 m series generated by make_wind_resource_yaml.py.
# -----------------------------------------------------------------

# Height at which the included time series is provided [m].
# The series is ALREADY at hub height (90 m), so the shear block below is currently inert (scaling factor = 1.0).
h_ref: 90.0

# Power-law shear configuration: ws_hub = ws_ref * (h_hub / h_ref) ^ alpha.
# INACTIVE while h_ref == hub height (90 m). It only takes effect if a future time series is supplied at a different reference height, in which
# case set h_ref to that height. Do NOT lower h_ref for the current series: it is already at 90 m and would be double-scaled.
shear:
  method: power_law
  alpha: 0.17                 # Site-derived from ERA5 10 m / 100 m levels

# Weibull sector-fitting configuration (used by degradation/site.py for the XRSite resource object). turbulence_intensity is the ambient TI applied
# in the wake simulation: 0.14, IEC turbulence class B (onshore).
weibull_fit:
  n_sectors: 12               # 12 x 30 deg sectors
  turbulence_intensity: 0.14

# Hub-height ERA5 hourly time series (90 m).
# Keys: wind_resource.time (UTC), .wind_speed, .wind_direction, .turbulence_intensity.data (constant 0.14)
time_series: !include ../data/wind_resource_2022_era5_90m.yaml